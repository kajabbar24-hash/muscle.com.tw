<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>公關部年度工作計畫</title>
<style>
  :root {
    --brand: #1F5FAD; --brand-2: #2F74C8; --brand-dark: #143F73; --brand-soft: #DCE8F7;
    --bg: #F4F7FB; --card: #FFFFFF; --text: #1C2733; --muted: #6B7785; --line: #E3E9F1;
    --ok: #1E7B45; --ok-soft: #D9F2E3; --warn: #B45309; --warn-soft: #FFE8CC; --bad: #C62828; --bad-soft: #FDE2E1;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 15px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--brand); color: #fff; padding: 14px 16px 12px; }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; }
  header .who { margin-top: 2px; font-size: 13px; opacity: .85; }
  main { padding: 14px 16px calc(84px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: repeat(4, 1fr);
    background: #fff; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav button { border: 0; background: none; padding: 9px 0 8px; font-size: 12px; color: var(--muted); display: flex;
    flex-direction: column; align-items: center; gap: 3px; font-family: inherit; }
  nav button svg { width: 22px; height: 22px; }
  nav button.on { color: var(--brand); font-weight: 700; }
  .card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(20,63,115,.08); }
  .chips { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 13px; color: var(--muted);
    white-space: nowrap; font-family: inherit; }
  .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .task-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .tid { font-size: 12px; color: var(--muted); }
  .tname { font-weight: 700; margin: 2px 0 6px; line-height: 1.4; }
  .meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .badge { font-size: 12px; padding: 3px 9px; border-radius: 999px; white-space: nowrap; font-weight: 600; }
  .b-未開始 { background: #EEF1F5; color: #4B5563; } .b-進行中 { background: var(--brand-soft); color: var(--brand); }
  .b-已完成 { background: var(--ok-soft); color: var(--ok); } .b-延誤 { background: var(--warn-soft); color: var(--warn); }
  .late { color: var(--bad); font-weight: 700; }
  .bar { height: 6px; background: #EEF1F5; border-radius: 6px; overflow: hidden; margin: 10px 0 4px; }
  .bar > i { display: block; height: 100%; background: var(--brand-2); }
  .note { font-size: 13px; background: var(--bg); border-radius: 8px; padding: 6px 10px; margin-top: 8px; color: #374151; }
  .btns { display: flex; gap: 8px; margin-top: 12px; }
  .btn { flex: 1; border: 1px solid var(--brand); background: #fff; color: var(--brand); border-radius: 10px; padding: 10px; font-size: 14px;
    font-weight: 600; font-family: inherit; }
  .btn.primary { background: var(--brand); color: #fff; }
  .btn:disabled { opacity: .45; }
  label.f { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
  select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 15px; font-family: inherit;
    background: #fff; color: var(--text); }
  textarea { resize: none; height: 70px; }
  input[type=range] { width: 100%; accent-color: var(--brand); }
  .pct { font-size: 28px; font-weight: 800; color: var(--brand); text-align: center; }
  .count { text-align: right; font-size: 12px; color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat { background: #fff; border-radius: 12px; padding: 12px 8px; text-align: center; box-shadow: 0 1px 2px rgba(20,63,115,.08); }
  .stat b { display: block; font-size: 22px; color: var(--brand); } .stat span { font-size: 12px; color: var(--muted); }
  .stat.bad b { color: var(--bad); }
  .goal { margin-bottom: 12px; } .goal:last-child { margin-bottom: 0; }
  .goal-h { display: flex; justify-content: space-between; font-size: 13px; }
  .goal-h b { color: var(--brand-dark); } .goal-t { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .filters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .filters select { padding: 8px; font-size: 13px; }
  .person { display: flex; align-items: center; justify-content: space-between; padding: 14px; border: 1px solid var(--line);
    border-radius: 12px; margin-bottom: 10px; background: #fff; width: 100%; text-align: left; font-family: inherit; font-size: 15px; color: var(--text); }
  .person small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .person.taken { opacity: .45; } .person.mine { border-color: var(--brand); background: var(--brand-soft); }
  .person.sel { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand) inset; }
  .empty { text-align: center; color: var(--muted); padding: 36px 12px; line-height: 1.7; }
  .msg { text-align: center; padding: 40px 16px; line-height: 1.8; }
  .msg h2 { font-size: 17px; margin: 8px 0; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--brand-soft); border-top-color: var(--brand); border-radius: 50%;
    animation: spin .8s linear infinite; margin: 40px auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #1C2733; color: #fff;
    padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; max-width: 90%; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header><h1 id="title">我的任務</h1><div class="who" id="who">載入中…</div></header>
<main id="app"><div class="spinner"></div><div class="empty">正在連線 LINE…</div></main>
<nav id="nav">
  <button data-v="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>我的任務</button>
  <button data-v="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>回報進度</button>
  <button data-v="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-6"/></svg>進度總覽</button>
  <button data-v="bind"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>綁定身分</button>
</nav>
<div id="toast"></div>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const LIFF_ID = '2012814339-HSNiKYSN';
const API = 'https://script.google.com/macros/s/AKfycby_c_vuXjOwdgwuL4eomxG8c-zV2HR7IH3XlWGflaZ3IpBOcRaKdj6C2BOZp6CBG-xT/exec';
const VIEWS = { tasks: '我的任務', report: '回報進度', overview: '進度總覽', bind: '綁定身分' };

const app = document.getElementById('app');
const state = { view: 'tasks', me: null, tasks: null, filter: 'open', reportId: '', ov: null, ovF: { goal: '', owner: '', status: '' } };

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2200); }
function loading(t) { app.innerHTML = `<div class="spinner"></div><div class="empty">${esc(t || '載入中…')}</div>`; }
function message(title, body, btn) {
  app.innerHTML = `<div class="msg"><h2>${esc(title)}</h2><div>${body || ''}</div>${btn ? `<div class="btns" style="max-width:260px;margin:18px auto 0">${btn}</div>` : ''}</div>`;
}

async function api(action, params = {}) {
  const idToken = liff.getIDToken();
  const q = new URLSearchParams(Object.assign({ action, idToken }, params));
  const res = await fetch(API + '?' + q.toString());
  const data = await res.json();
  if (!data.ok && data.code === 'TOKEN_INVALID') {
    message('登入已過期', '請關閉這個畫面後，從選單重新開啟。', `<button class="btn primary" onclick="relogin()">重新登入</button>`);
    throw new Error('TOKEN_INVALID');
  }
  return data;
}
function relogin() { liff.logout(); liff.login({ redirectUri: location.href }); }

function setWho() {
  document.getElementById('who').textContent = state.me ? `${state.me.name}｜${state.me.title}${state.me.isAdmin ? '（管理者）' : ''}` : '尚未綁定身分';
}

function go(view) {
  if (!VIEWS[view]) view = 'tasks';
  state.view = view;
  document.getElementById('title').textContent = VIEWS[view];
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  const u = new URL(location.href); u.searchParams.set('view', view); history.replaceState(null, '', u.toString());
  render().catch(err => { if (err.message !== 'TOKEN_INVALID') message('發生錯誤', esc(err.message || err), `<button class="btn primary" onclick="go(state.view)">再試一次</button>`); });
}

async function render() {
  if (state.view === 'bind') return renderBind();
  if (!state.me) {
    message('請先綁定身分', '第一次使用，請從名單中選擇你是誰。', `<button class="btn primary" onclick="go('bind')">前往綁定</button>`);
    return;
  }
  if (state.view === 'tasks') return renderTasks();
  if (state.view === 'report') return renderReport();
  if (state.view === 'overview') return renderOverview();
}

/* ---------- 我的任務 ---------- */
async function loadMine(force) {
  if (state.tasks && !force) return state.tasks;
  const d = await api('me');
  if (!d.ok) { if (d.code === 'NOT_BOUND') { state.me = null; setWho(); } throw new Error(d.message); }
  state.me = d.me; setWho(); state.tasks = d.tasks; return d.tasks;
}
function dueText(t) {
  if (t.status === '已完成') return `截止 ${esc(t.due)}`;
  if (t.overdue) return `<span class="late">已逾期 ${-t.daysLeft} 天（${esc(t.due)}）</span>`;
  if (t.daysLeft === 0) return `<span class="late">今天截止</span>`;
  return `截止 ${esc(t.due)}（剩 ${t.daysLeft} 天）`;
}
function taskCard(t, withButtons) {
  return `<div class="card">
    <div class="task-top"><div><div class="tid">${esc(t.id)}｜${esc(t.goal)}</div><div class="tname">${esc(t.name)}</div></div>
      <span class="badge b-${esc(t.status)}">${esc(t.status)}</span></div>
    <div class="meta"><span>${dueText(t)}</span>${withButtons ? '' : `<span>負責人：${esc(t.owner)}</span>`}</div>
    <div class="bar"><i style="width:${t.progress}%"></i></div>
    <div class="meta"><span>完成度 ${t.progress}%</span>${t.updated ? `<span>更新 ${esc(t.updated)}</span>` : ''}</div>
    ${t.note ? `<div class="note">📝 ${esc(t.note)}</div>` : ''}
    ${withButtons && t.status !== '已完成' ? `<div class="btns">
      <button class="btn" ${t.status === '進行中' ? 'disabled' : ''} onclick="quick('${esc(t.id)}','進行中',this)">改為進行中</button>
      <button class="btn primary" onclick="quick('${esc(t.id)}','已完成',this)">改為已完成</button></div>` : ''}
  </div>`;
}
async function renderTasks() {
  if (!state.tasks) loading('讀取你的任務…');
  const tasks = await loadMine();
  const f = state.filter;
  const list = tasks.filter(t => f === 'all' || (f === 'open' ? t.status !== '已完成' : t.status === '已完成'));
  const chip = (k, n) => `<button class="chip ${f === k ? 'on' : ''}" onclick="state.filter='${k}';renderTasks()">${n}</button>`;
  app.innerHTML = `<div class="chips">${chip('open', '未完成')}${chip('all', '全部')}${chip('done', '已完成')}</div>` +
    (list.length ? list.map(t => taskCard(t, true)).join('') : `<div class="empty">${tasks.length ? '這個分類沒有任務 🎉' : '目前沒有指派給你的任務'}</div>`);
}
async function quick(id, status, btn) {
  btn.disabled = true;
  try {
    const d = await api('update', { taskId: id, status });
    if (!d.ok) throw new Error(d.message);
    const i = state.tasks.findIndex(t => t.id === id); if (i >= 0) state.tasks[i] = d.task;
    state.ov = null; toast(`已改為「${d.task.status}」`); renderTasks();
  } catch (e) { if (e.message !== 'TOKEN_INVALID') { toast(e.message); btn.disabled = false; } }
}

/* ---------- 回報進度 ---------- */
async function renderReport() {
  if (!state.tasks) loading('讀取你的任務…');
  const tasks = (await loadMine()).filter(t => t.status !== '已完成');
  if (!tasks.length) { app.innerHTML = `<div class="empty">你目前沒有未完成的任務 🎉</div>`; return; }
  if (!tasks.some(t => t.id === state.reportId)) state.reportId = tasks[0].id;
  const cur = tasks.find(t => t.id === state.reportId);
  app.innerHTML = `<div class="card">
    <label class="f" style="margin-top:0">選擇任務</label>
    <select id="rTask" onchange="state.reportId=this.value;renderReport()">${tasks.map(t =>
      `<option value="${esc(t.id)}" ${t.id === cur.id ? 'selected' : ''}>${esc(t.id)} ${esc(t.name)}</option>`).join('')}</select>
    <div class="meta" style="margin-top:8px"><span>${dueText(cur)}</span><span>目前 ${esc(cur.status)}｜${cur.progress}%</span></div>
    <label class="f">完成度</label>
    <div class="pct" id="rPct">${cur.progress}%</div>
    <input type="range" id="rRange" min="0" max="100" step="10" value="${cur.progress}" oninput="document.getElementById('rPct').textContent=this.value+'%'">
    <label class="f">一句備註（選填）</label>
    <textarea id="rNote" maxlength="50" placeholder="例如：已完成 6 篇，剩 3 篇排程中" oninput="document.getElementById('rCnt').textContent=this.value.length+'/50'"></textarea>
    <div class="count" id="rCnt">0/50</div>
    ${cur.note ? `<div class="note">上次備註：${esc(cur.note)}</div>` : ''}
    <div class="btns"><button class="btn primary" id="rBtn" onclick="submitReport()">送出回報</button></div>
    <div class="meta" style="margin-top:10px">填 100% 會自動改為「已完成」。</div>
  </div>`;
}
async function submitReport() {
  const btn = document.getElementById('rBtn'); btn.disabled = true; btn.textContent = '送出中…';
  try {
    const d = await api('update', { taskId: state.reportId, progress: document.getElementById('rRange').value, note: document.getElementById('rNote').value.trim() });
    if (!d.ok) throw new Error(d.message);
    const i = state.tasks.findIndex(t => t.id === d.task.id); if (i >= 0) state.tasks[i] = d.task;
    state.ov = null; toast(`已回報：${d.task.progress}%（${d.task.status}）`); renderReport();
  } catch (e) { if (e.message !== 'TOKEN_INVALID') { toast(e.message); btn.disabled = false; btn.textContent = '送出回報'; } }
}

/* ---------- 進度總覽 ---------- */
async function renderOverview() {
  if (!state.me.isAdmin) { message('此功能僅限管理者使用', '如需查看全體進度，請洽 Monique 或 Tim。'); return; }
  if (!state.ov) { loading('讀取全體進度…'); const d = await api('overview'); if (!d.ok) throw new Error(d.message); state.ov = d; }
  const o = state.ov, F = state.ovF;
  const list = o.tasks.filter(t => (!F.goal || t.goal === F.goal) && (!F.owner || t.owner === F.owner) &&
    (!F.status || (F.status === '逾期' ? t.overdue : t.status === F.status)));
  const opt = (arr, v, all) => `<option value="">${all}</option>` + arr.map(x => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('');
  app.innerHTML = `
    <div class="stats"><div class="stat"><b>${o.total ? Math.round(o.done / o.total * 100) : 0}%</b><span>整體完成率</span></div>
      <div class="stat"><b>${o.done}/${o.total}</b><span>已完成任務</span></div>
      <div class="stat ${o.overdue ? 'bad' : ''}"><b>${o.overdue}</b><span>逾期任務</span></div></div>
    <div class="card">${o.goals.map(g => `<div class="goal"><div class="goal-h"><b>${esc(g.goal)}</b><span>${g.done}/${g.total}｜${g.rate}%${g.overdue ? `｜<span class="late">逾期 ${g.overdue}</span>` : ''}</span></div>
      <div class="goal-t">${esc(g.title)}</div><div class="bar"><i style="width:${g.rate}%"></i></div></div>`).join('')}</div>
    <div class="filters">
      <select onchange="state.ovF.goal=this.value;renderOverview()">${opt(o.goals.map(g => g.goal), F.goal, '全部目標')}</select>
      <select onchange="state.ovF.owner=this.value;renderOverview()">${opt(o.owners, F.owner, '全部負責人')}</select>
      <select onchange="state.ovF.status=this.value;renderOverview()">${opt(['未開始', '進行中', '已完成', '延誤', '逾期'], F.status, '全部狀態')}</select>
    </div>
    ${list.length ? list.map(t => taskCard(t, false)).join('') : '<div class="empty">沒有符合條件的任務</div>'}
    <div class="btns"><button class="btn" onclick="state.ov=null;renderOverview()">重新整理</button></div>`;
}

/* ---------- 綁定身分 ---------- */
async function renderBind() {
  loading('讀取名單…');
  const d = await api('names');
  if (!d.ok) throw new Error(d.message);
  state.me = d.me; setWho();
  const people = d.people;
  app.innerHTML = (d.me ? `<div class="card" style="text-align:center">✅ 你已綁定為 <b>${esc(d.me.name)}</b><br><span class="meta" style="justify-content:center">如要換人，請點選下方其他名字</span></div>` :
      `<div class="card">第一次使用：請從名單點選你自己，再按「確認綁定」。</div>`) +
    people.map(p => `<button class="person ${p.mine ? 'mine' : ''} ${p.bound && !p.mine ? 'taken' : ''}" ${p.bound && !p.mine ? 'disabled' : ''}
        data-name="${esc(p.name)}" onclick="pick(this)"><div>${esc(p.name)}<small>${esc(p.title)}｜${esc(p.dept)}</small></div>
        <span class="meta">${p.mine ? '目前的你' : p.bound ? '已被綁定' : ''}</span></button>`).join('') +
    `<div class="btns"><button class="btn primary" id="bBtn" disabled onclick="doBind()">確認綁定</button></div>`;
}
function pick(el) {
  document.querySelectorAll('.person').forEach(p => p.classList.remove('sel'));
  el.classList.add('sel'); state.pick = el.dataset.name;
  const b = document.getElementById('bBtn'); b.disabled = false; b.textContent = `確認綁定為「${state.pick}」`;
}
async function doBind() {
  const b = document.getElementById('bBtn'); b.disabled = true; b.textContent = '綁定中…';
  try {
    const d = await api('bind', { name: state.pick });
    if (!d.ok) throw new Error(d.message);
    state.me = d.me; state.tasks = null; state.ov = null; setWho();
    toast(`綁定成功：${d.me.name}${d.firstAdmin ? '（你是第一位，已設為管理者）' : ''}`);
    setTimeout(() => go('tasks'), 600);
  } catch (e) { if (e.message !== 'TOKEN_INVALID') { toast(e.message); renderBind(); } }
}

/* ---------- 啟動 ---------- */
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => go(b.dataset.v)));
(async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    const view = new URLSearchParams(location.search).get('view') || 'tasks';
    const d = await api('names');
    state.me = d.ok ? d.me : null; setWho();
    go(state.me ? view : 'bind');
    if (!state.me && view !== 'bind') toast('請先綁定身分');
  } catch (e) {
    if (e.message !== 'TOKEN_INVALID') message('無法啟動', '請從 LINE 官方帳號的選單開啟這個畫面。<br><small>' + esc(e.message || e) + '</small>');
  }
})();
</script>
</body>
</html>
